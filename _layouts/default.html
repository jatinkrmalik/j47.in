<!DOCTYPE html>

<html lang="en" class="crt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ site.title }}</title>

{% seo title=false %}
  <!-- Apply the saved theme before first paint (see assets/js/terminal-ui.js) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('j47-theme');
        if (/^(green|amber|white|plasma|dos|lcd|paper)$/.test(t)) document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('j47-crt') === 'off') document.documentElement.classList.add('no-crt');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="{{ 'assets/favicon.ico' | relative_url }}" />
  <link rel="manifest" href="{{ 'assets/site.webmanifest' | relative_url }}">
  <link rel="stylesheet" href="{{ 'assets/css/normalize.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ 'assets/css/open-color.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ 'assets/css/styles.css' | relative_url }}" />
  <!-- Terminal fonts CSS -->
  <link rel="stylesheet" href="{{ 'assets/css/terminal-fonts.css' | relative_url }}" />
  <!-- Retro terminal theme palettes -->
  <link rel="stylesheet" href="{{ 'assets/css/themes.css' | relative_url }}" />
  <!-- Custom theme toggle CSS -->
  <link rel="stylesheet" href="{{ 'assets/css/theme-toggle.css' | relative_url }}" />
  <!-- Custom styles to override theme defaults -->
  <link rel="stylesheet" href="{{ 'assets/css/custom-styles.css' | relative_url }}" />
  <!-- Viewport fix CSS - loads last to override other styles -->
  <link rel="stylesheet" href="{{ 'assets/css/viewport-fix.css' | relative_url }}" />
  <!-- CRT scanline overlay effects -->
  <link rel="stylesheet" href="{{ 'assets/css/crt-overlay.css' | relative_url }}" />
  <!-- CRT power-on animation (plays once on load) -->
  <link rel="stylesheet" href="{{ 'assets/css/crt-poweron.css' | relative_url }}" />
  <!-- Status line, theme picker and shortcuts help -->
  <link rel="stylesheet" href="{{ 'assets/css/terminal-ui.css' | relative_url }}" />
  <!-- Script to suppress source map warnings -->
  <script src="{{ 'assets/js/suppress-sourcemap.js' | relative_url }}"></script>
  <script src="{{ 'assets/js/typed.umd.js' | relative_url }}"></script>
  <style>
    /* All CSS for CRT effect is now managed by viewport-fix.css */
    
    /* Each theme's own text-mode font (themes.css) */
    body {
      font-family: var(--term-font, 'IBM VGA', monospace);
      font-size: 1em;
    }
    
    /* Blinking cursor is also managed in viewport-fix.css */
    @keyframes blink {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>
</head>

<body>
<div class="crt-poweron" aria-hidden="true"><div class="crt-poweron__beam"></div></div>
<div class="crt-scanlines"></div>
<div class="crt-scanline"></div>
<div class="crt-flicker"></div>
<div class="crt-texture"></div>

  <main>

{{ content }}

  </main>

  <footer class="statusbar">
    <div class="statusbar__line">
      <span class="statusbar__host">j47.in</span>
      <!-- Links, Norton Commander style: the letter is also the keyboard shortcut -->
      <nav class="keybar" aria-label="Elsewhere">
        {%- for link in site.data.social %}
        <a href="{{ link.url }}" data-key="{{ link.key }}" aria-keyshortcuts="{{ link.key }}"{% unless link.url contains 'mailto:' %} rel="me noopener" target="_blank"{% endunless %}><kbd>{{ link.key }}</kbd><span>
          {%- if link.icon -%}
          <svg class="keybar__icon" viewBox="0 0 {{ link.icon[0] | size }} {{ link.icon | size }}" aria-hidden="true" focusable="false"><path d="
            {%- for row in link.icon -%}
              {%- assign y = forloop.index0 -%}
              {%- assign pixels = row | split: "" -%}
              {%- for p in pixels -%}{%- if p == "#" -%}M{{ forloop.index0 }} {{ y }}h1v1h-1z{%- endif -%}{%- endfor -%}
            {%- endfor -%}
          "/></svg>
          {%- endif -%}
          <span class="keybar__label">{{ link.label }}</span></span></a>
        {%- endfor %}
      </nav>
      <span class="statusbar__msg" role="status" aria-live="polite"></span>
      <button type="button" data-action="help" aria-haspopup="dialog" aria-keyshortcuts="?">[?]<span class="statusbar__help-label"> help</span></button>
      <button type="button" data-action="theme" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu" aria-keyshortcuts="t"><span class="statusbar__theme-label">theme: </span><span class="statusbar__theme-name">auto</span> &#9652;</button>
    </div>
    <div class="theme-menu" id="theme-menu" hidden>
      <p class="theme-menu__title">&#9508; select theme &#9500;</p>
      <div class="theme-menu__list" role="listbox" aria-label="Theme"></div>
      <p class="theme-menu__hint">&#8593;&#8595; preview &middot; enter pick &middot; esc cancel</p>
    </div>
  </footer>

  <dialog class="help" id="help" aria-labelledby="help-title">
    <h2 class="help__title" id="help-title">&#9508; keyboard shortcuts &#9500;</h2>
    <dl class="help__list" id="help-list"></dl>
    <p class="help__footer"><button type="button" data-action="close-help">[ esc ] close</button></p>
  </dialog>
  <script>
    // Reduced motion: show the first title and skip the typing loop
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var first = document.querySelector('#strings > span');
      var target = document.getElementById('typed');
      if (first && target) target.textContent = first.textContent;
    } else
    // Add a slight delay for the typed effect to enhance the terminal feel
    setTimeout(function() {
      var typed = new Typed("#typed", {
        stringsElement: "#strings",
        backSpeed: 30,
        typeSpeed: 70,
        backDelay: 800,
        loop: true,
        smartBackspace: true,
      });
    }, 2500);
    
    // Uncomment to toggle between different font styles for testing
    /*
    document.addEventListener('DOMContentLoaded', function() {
      // Available fonts: font-vt323, font-ibm, font-sharetech, font-space
      document.body.classList.add('font-ibm');
    });
    */
  </script>
  <!-- Viewport scaling script -->
  <script src="{{ 'assets/js/viewport-scale.js' | relative_url }}"></script>
  <!-- Theme picker + keyboard shortcuts -->
  <script src="{{ 'assets/js/terminal-ui.js' | relative_url }}"></script>
</body>

</html>
