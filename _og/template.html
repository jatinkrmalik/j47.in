<style>
  @font-face {
    font-family: 'IBM MDA';

  :root {
    --bg: #000;
    --punct: #00ff41;
    --keyval: #00cc36;
    --glow: 0 0 2px currentColor, 0 0 12px rgba(0, 255, 65, 0.45);
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    position: relative;
    font-family: 'IBM MDA', monospace;
    color: var(--punct);
    text-shadow: var(--glow);
    -webkit-font-smoothing: none;
    font-synthesis: none;
  }

  /* ---------- screen content ---------- */
  .screen {
    position: absolute;
    inset: 0 0 64px;
    padding: 66px 84px 0;
  }

  .name {
    font-size: 84px;          /* 6x the MDA 14px cell */
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 0 3px currentColor, 0 0 24px rgba(0, 255, 65, 0.55);
  }

  .role {
    margin-top: 18px;
    font-size: 35px;          /* 2.5x */
    color: var(--keyval);
  }

  .json {
    margin-top: 52px;
    font-family: inherit;     /* <pre> would otherwise use the default monospace */
    font-size: 28px;          /* 2x */
    line-height: 50px;
    white-space: pre;
  }

  .k, .v { color: var(--keyval); }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 0.95em;
    margin-left: 4px;
    vertical-align: -0.12em;
    background: var(--punct);
    box-shadow: 0 0 10px rgba(0, 255, 65, 0.6);
  }

  /* ---------- status line, as on the site ---------- */
  .statusbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 56px 6px;
    font-size: 24px;
    white-space: nowrap;
    border-top: 2px solid var(--punct);
  }

  .host {
    padding: 0 10px;
    background: var(--punct);
    color: var(--bg);
    text-shadow: none;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .link kbd {
    font: inherit;
    color: var(--keyval);
  }

  .link span {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    background: var(--punct);
    color: var(--bg);
    text-shadow: none;
  }

  .link svg {
    height: 18px;             /* 2px per logo pixel */
    fill: currentColor;
    shape-rendering: crispEdges;
  }

  .spacer { flex: 1; }

  /* ---------- the glass: scan lines, vignette, glare, tube corners ---------- */
  .glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(180deg,
        transparent 0, transparent 2px,
        rgba(0, 0, 0, 0.42) 3px, transparent 4px),
      linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 38%),
      radial-gradient(ellipse 115% 105% at 50% 50%,
        transparent 58%, rgba(0, 0, 0, 0.62) 100%);
  }

  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 34px;
    box-shadow:
      0 0 0 60px #050505,
      inset 0 0 50px rgba(0, 0, 0, 0.75);
  }
</style>
</head>
