- key: about_me
  value: >-
    I've been writing code for close to 20 years, and doing it for a living since 2014.
    I'm a Principal Engineer at Atlassian and the architect of its agentic interfaces platform,
    the front door every AI agent goes through to reach Jira, Confluence and the rest over MCP, A2A and CLI.
    Before that I built data residency at Atlassian and scaled distributed systems at Uber, Synaptic, Shuttl and Adobe.
    Off the clock I build open-source tools like Vocalinux, tinker with my homelab and write about all of it on my blog.

